name: R CMD check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          # R-devel runs continuously because late CRAN failures often expose
          # forward-compatibility problems that release R cannot see.
          - {os: ubuntu-latest, r: devel}
          # manual: true builds the PDF manual on this leg only (LaTeX
          # failures are a classic CRAN incoming failure the --no-manual legs
          # cannot see).
          - {os: ubuntu-latest, r: release, manual: true}
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.manual

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # src/rust/upstream/ and src/rust/vendor.tar.xz ARE committed (see the
      # notes in .gitignore) so the repo is self-contained and this checkout
      # is exactly what R-universe and CRAN build. Verify the committed
      # snapshot matches the pin WITHOUT regenerating it — the check below
      # must test the committed tree, not a freshly re-vendored one.
      # Regeneration drift is caught by the vendor-drift job.
      - name: Committed vendor snapshot matches the pin
        run: Rscript tools/check-vendor-drift.R

      - name: R CMD check
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          CARGO_NET_OFFLINE: true
          # Empty on the manual: true leg so the PDF manual is built there.
          CHECK_NO_MANUAL: ${{ matrix.config.manual != true && '--no-manual' || '' }}
        run: |
          no_manual <- Sys.getenv("CHECK_NO_MANUAL")
          rcmdcheck::rcmdcheck(args = c(if (nzchar(no_manual)) no_manual, "--as-cran"), error_on = "warning", check_dir = "check")
        shell: Rscript {0}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-${{ matrix.config.os }}
          path: check

  vendor-drift:
    name: vendor regeneration drift (ubuntu, R release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # vendor-rust.R runs `cargo vendor`, so the job needs a Rust toolchain
      # explicitly (the runner image happens to preinstall one; do not rely
      # on that).
      - uses: dtolnay/rust-toolchain@stable

      # Preserve the committed archive before regeneration overwrites it:
      # the tarball must be compared by CONTENT, not bytes (bsdtar vs GNU
      # tar headers and fresh mtimes make byte equality impossible).
      - name: Stash the committed vendor archive
        run: cp src/rust/vendor.tar.xz /tmp/committed-vendor.tar.xz

      # tools/vendor-rust.R clones the public mixeff-rs repo at PINNED_REV and
      # rewrites the committed snapshot, so this job needs network access. It
      # runs in its own checkout: the mutation can never "heal" the tree the
      # check matrix above tests.
      - name: Regenerate the vendored snapshot at the pinned rev
        run: Rscript tools/vendor-rust.R

      # Three-part equivalence, excluding the two spots where byte equality
      # is impossible by construction: mixeff-rs.lock carries a vendored_utc
      # timestamp (compared field-wise without it), and vendor.tar.xz is not
      # byte-reproducible across tar implementations (compared by extracted
      # content).
      - name: Regeneration must reproduce the committed tree
        run: |
          git diff --exit-code -- src/rust/upstream ':!src/rust/upstream/mixeff-rs.lock' src/rust/vendor-config.toml inst/AUTHORS inst/COPYRIGHTS inst/LICENSE.note
          diff <(git show HEAD:src/rust/upstream/mixeff-rs.lock | grep -v '^vendored_utc') \
               <(grep -v '^vendored_utc' src/rust/upstream/mixeff-rs.lock)

      - name: Regenerated vendor archive must match the committed one by content
        run: |
          mkdir -p /tmp/vendor-committed /tmp/vendor-fresh
          tar -xJf /tmp/committed-vendor.tar.xz -C /tmp/vendor-committed
          tar -xJf src/rust/vendor.tar.xz -C /tmp/vendor-fresh
          diff -r /tmp/vendor-committed /tmp/vendor-fresh
