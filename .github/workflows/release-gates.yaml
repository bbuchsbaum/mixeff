name: Release gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::jsonvalidate, any::rmarkdown
          needs: test

      # src/rust/upstream/ and src/rust/vendor.tar.xz ARE committed (see the
      # notes in .gitignore): every gate below runs against the committed
      # tree — the same artifact R-universe and CRAN build. The drift check
      # verifies it matches the pin without regenerating anything;
      # regeneration drift is caught by the vendor-drift job in
      # R-CMD-check.yaml.
      - name: License notice is current
        run: Rscript tools/check-license-note.R

      - name: Vendored Rust snapshot is current
        run: Rscript tools/check-vendor-drift.R

      - name: Install package (release build)
        env:
          CARGO_NET_OFFLINE: true
        run: R CMD INSTALL --preclean .

      # Mirrors tools/release-gate.R: the FULL fast suite against the
      # INSTALLED build, all six MIXEFF_* tier flags cleared, NOT_CRAN=true so
      # skip_on_cran blocks run here. stop_on_failure makes any test failure
      # fail the job.
      - name: Full fast test suite (installed build)
        env:
          NOT_CRAN: true
        run: |
          Sys.unsetenv(c("MIXEFF_RUN_SLOW_PARITY", "MIXEFF_RUN_APHANTASIA",
                         "MIXEFF_APHANTASIA_JOINT", "MIXEFF_RUN_APHANTASIA_STRESS",
                         "MIXEFF_APHANTASIA_JOINT_PROOF",
                         "MIXEFF_APHANTASIA_JOINT_BUDGET"))
          testthat::test_dir("tests/testthat", package = "mixeff",
                             load_package = "installed",
                             stop_on_failure = TRUE)
        shell: Rscript {0}

      - name: No-network source install
        env:
          CARGO_NET_OFFLINE: true
        run: Rscript tools/check-offline-install.R
