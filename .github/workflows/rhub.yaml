name: MKL variance-component diagnostic
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.setup.outputs.containers }}
    steps:
      - uses: r-hub/actions/setup@v1
        id: setup
        with:
          config: mkl
  diagnostic:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}
    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
        env:
          MIXEFF_DIAG_OUT: /tmp/mkl-pairs
      - name: Evaluate original check covariances
        if: always()
        run: Rscript assessment/mkl-captured-objectives.R . mkl-diagnostic-output > mkl-diagnostic.log 2>&1
      - name: Bounded multistart with default MKL threads
        if: always()
        run: Rscript assessment/mkl-multistart.R . mkl-multistart-default > mkl-multistart-default.log 2>&1
      - name: Bounded multistart with one MKL thread
        if: always()
        env:
          MKL_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: Rscript assessment/mkl-multistart.R . mkl-multistart-one > mkl-multistart-one.log 2>&1
      - name: Show diagnostic result
        if: always()
        run: test ! -f mkl-diagnostic.log || cat mkl-diagnostic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mkl-parity-diagnostic
          path: |
            mkl-multistart-*/
            mkl-multistart-*.log
            mkl-diagnostic.log
            mkl-diagnostic-output/
            /tmp/mkl-pairs/
            check/**/00check.log
            check/**/00install.out
            check/**/testthat.Rout*
